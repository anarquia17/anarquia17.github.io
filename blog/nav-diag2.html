<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diag navbar 2</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
body { background: #0a0f1e; color: #e6edf3; font-family: monospace; }
pre { background: #111827; padding: 14px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; margin: 16px; }
.ok { color: #4ade80; } .bad { color: #f87171; }
main { padding: 100px 20px; }
</style>
</head>
<body>
<header class="navbar scrolled">
  <div class="container navbar-inner">
    <a href="../index.html" class="logo">JD<span class="logo-dot">.</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="../index.html#inicio">Inicio</a>
      <a href="../index.html#blog">Blog</a>
      <a href="../index.html#contacto">Contacto</a>
    </nav>
    <div class="navbar-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Cambiar idioma / Switch language">
        <span id="langLabel">EN</span>
      </button>
      <button class="menu-toggle" id="menuToggle" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
<main>
<h2 style="color:#00e5ff">🔍 Diag con navbar REAL</h2>
<pre id="out">Analizando...</pre>
</main>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/main.js"></script>
<script>
const out = document.getElementById('out');
const lines = [];
const add = (t, ok) => lines.push((ok ? '✅ ' : '❌ ') + t);
window.addEventListener('load', () => {
  add('Viewport: ' + window.innerWidth + 'px', true);
  ['menuToggle','navLinks','langToggle','langLabel'].forEach(id => {
    add('#' + id + ': ' + (document.getElementById(id) ? 'existe' : 'NO EXISTE'), !!document.getElementById(id));
  });
  const mt = document.getElementById('menuToggle');
  if (mt) {
    const cs = getComputedStyle(mt);
    add('menuToggle display: ' + cs.display + ' (debe ser flex en <860px)', cs.display !== 'none');
  }
  const nl = document.getElementById('navLinks');
  if (nl) {
    const cs = getComputedStyle(nl);
    add('navLinks transform inicial: ' + cs.transform, true);
  }
  // Click en hamburguesa
  const btn = document.getElementById('menuToggle');
  btn.addEventListener('click', () => {
    setTimeout(() => {
      const nl2 = document.getElementById('navLinks');
      const cs = getComputedStyle(nl2);
      add('TRAS CLICK: open=' + nl2.classList.contains('open') + ' transform=' + cs.transform, nl2.classList.contains('open'));
      out.textContent = lines.join('\n');
    }, 400);
  });
  out.textContent = lines.join('\n');
});
</script>
</body>
</html>
